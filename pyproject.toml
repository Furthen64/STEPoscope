[project]
name = "steposcope"
version = "0.1.0"
description = "An educational interactive walker for ISO-10303-21 STEP files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "vtk>=9.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
steposcope = "step_explorer.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.uv]
package = true
